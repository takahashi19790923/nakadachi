name: Secret scan

# GitHub の Secret Scanning と Push Protection が第一の防御だが、
# 独自の形式（セッション署名鍵など）は拾われない。自前でも見る。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: 秘密情報の混入確認
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 差分だけでなく履歴も見る（過去のコミットに残っていないか）。
          fetch-depth: 0

      - name: 追跡してはいけないファイルが入っていないか
        run: |
          set -e
          # ★.example は追跡してよい。★ 除かないと、正しい状態のリポジトリで
          # 毎回赤くなり、本当の混入と区別がつかなくなる。
          BAD=$(git ls-files | grep -E '^(\.env|\.dev\.vars)($|\.)' | grep -v '\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::秘密情報のファイルが追跡されています:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: .env / .dev.vars は追跡されていません"

      - name: 本物らしい鍵の形が含まれていないか
        run: |
          set -e
          # .env.example と .dev.vars.example のダミーは形が違うので当たらない。
          PATTERNS='sk_live_[0-9a-zA-Z]{20}|rk_live_[0-9a-zA-Z]{20}|whsec_[0-9a-zA-Z]{32}|re_[0-9A-Za-z]{24}|postgresql://[^:]+:[^@]+@[^/]+\.neon\.tech'
          if git grep -nIE "$PATTERNS" -- . ':!*.example' ':!.github/workflows/secret-scan.yml'; then
            echo "::error::秘密情報らしき文字列が見つかりました。SECURITY.md のローテーション手順に従ってください。"
            exit 1
          fi
          echo "OK: 秘密情報らしき文字列はありません"
