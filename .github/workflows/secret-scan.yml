name: Secret scan

# GitHub の Secret Scanning と Push Protection が第一の防御だが、
# 独自の形式（セッション署名鍵など）は拾われない。自前でも見る。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: 秘密情報の混入確認
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 差分だけでなく履歴も見る（過去のコミットに残っていないか）。
          fetch-depth: 0

      - name: 追跡してはいけないファイルが入っていないか
        run: |
          set -e
          # ★.example は追跡してよい。★ 除かないと、正しい状態のリポジトリで
          # 毎回赤くなり、本当の混入と区別がつかなくなる。
          BAD=$(git ls-files | grep -E '^(\.env|\.dev\.vars)($|\.)' | grep -v '\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::秘密情報のファイルが追跡されています:"
            echo "$BAD"
            exit 1
          fi
          echo "OK: .env / .dev.vars は追跡されていません"

      - name: 本物らしい鍵の形が含まれていないか
        run: |
          set -e
          # .env.example と .dev.vars.example のダミーは形が違うので当たらない。
          #
          # ★接続文字列はホスト名で絞らない。★ 以前は `\.neon\.tech` で
          # 終わっていて、2026-08-18 に本番を Supabase へ移した時点から
          # ★本番の接続文字列が素通りするようになっていた★
          # （2026-08-25 の公開前監査で発覚）。事業者を変えるたびに
          # 検査を直す作りにしない。パスワードを持つ postgres URL は
          # すべて拾い、ダミーだけを除く。
          PATTERNS='sk_live_[0-9a-zA-Z]{20}|rk_live_[0-9a-zA-Z]{20}|whsec_[0-9a-zA-Z]{32}|re_[0-9A-Za-z]{24}|postgres(ql)?://[^:[:space:]]+:[^@[:space:]<>]{8,}@[^/[:space:]]+'
          EXCLUDE=':!*.example :!.github/workflows/secret-scan.yml'

          # ローカルだけに向いた接続先と、書式見本のプレースホルダは除く。
          # ★永久に赤い検査は、無いのと同じになる。★ 鳴りっぱなしだと
          # 本当の混入も «またあれか» で流される。
          LOCAL='@127\.0\.0\.1|@localhost|@host\.docker|@\.\.\.'

          # ── いまの中身 ────────────────────────────────────────
          if git grep -nIE "$PATTERNS" -- . $EXCLUDE | grep -vE "$LOCAL"; then
            echo "::error::秘密情報らしき文字列が見つかりました。SECURITY.md のローテーション手順に従ってください。"
            exit 1
          fi

          # ── 履歴 ──────────────────────────────────────────────
          # ★git grep はリビジョンを渡さないと作業ツリーしか見ない。★
          # fetch-depth: 0 で履歴を取っておきながら、以前はそれを
          # 一度も読んでいなかった。混入 → 次のコミットで削除、という
          # よくある流れでは、2つ目のコミットで «OK» が出てしまう。
          # 消してもオブジェクトは残り、public リポジトリなら誰でも取れる。
          if git grep -nIE "$PATTERNS" $(git rev-list --all) -- . $EXCLUDE | grep -vE "$LOCAL"; then
            echo "::error::過去のコミットに秘密情報らしき文字列が残っています。★消しても履歴からは取り出せます。★ 必ず鍵をローテーションしてください（SECURITY.md）。"
            exit 1
          fi
          echo "OK: 秘密情報らしき文字列はありません（作業ツリー・履歴とも）"
