name: CI

# ★ここではデプロイしない。★ 本番へ出すのは Cloudflare Workers Builds と
# GitHub リポジトリの連携で行い、CI に本番の Secret を持たせない。
# デプロイ用のトークンを GitHub へ置かずに済む構成を優先している。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ★既定の権限を最小にする。★ ジョブごとに必要なものだけを足す。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 外部 Action はコミット SHA で固定する。タグは動かせるため。
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: pnpm を用意
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入（lockfile どおり）
        run: pnpm install --frozen-lockfile

      # ★lint より先に型を生成する。★ ルートの型（./+types/*）は
      # react-router typegen が作る。手元には前回のビルドの残りがあるので
      # 気づかないが、まっさらな CI では型が解決できず lint が落ちる。
      - name: 型を生成
        run: pnpm exec react-router typegen

      - name: lint
        run: pnpm run lint

      - name: typecheck
        run: pnpm run typecheck

      - name: 単体テスト
        run: pnpm run test

      # 統合テストは PGlite（PostgreSQL の WASM ビルド）を自分で立てる。
      # サービスコンテナも外部の DB も要らない。
      - name: 統合テスト
        run: pnpm run test:integration

      - name: build
        run: pnpm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ★DB を与える。★ 無いと、投稿一覧・詳細・地域ページが
    # ConfigurationError で 503 になり、404 を確かめる検査が落ちる。
    # 「DB を使わない画面だけ緑」では、壊れても気づけない。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nakadachi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_DEV: postgresql://postgres:postgres@localhost:5432/nakadachi_ci

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: pnpm を用意
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入
        run: pnpm install --frozen-lockfile

      - name: 型を生成
        run: pnpm exec react-router typegen

      - name: ブラウザを用意
        run: pnpm exec playwright install --with-deps chromium

      # マイグレーションと初期データ。pg_trgm も 0000 で入る。
      - name: DB を用意
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      # ★.dev.vars はビルド時に build/server/ へコピーされる。★
      # ビルドより前に書いておかないと、preview サーバーが DB 無しで起動する。
      - name: アプリへ接続先を渡す
        run: |
          node scripts/dev-setup.mjs
          echo "DATABASE_URL=\"$DATABASE_URL_DEV\"" >> .dev.vars

      # ★本番ビルドに対して実行する。★ 開発サーバーだと Vite が
      # HMR 用のインラインスクリプトを差し込み、CSP 違反が必ず出るため
      # 「本番でも壊れているのか」を区別できない。
      - name: E2E
        run: pnpm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    name: 依存の脆弱性確認
    runs-on: ubuntu-latest
    # pull_request でしか動かない Action。
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: dependency-review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: 既知の脆弱性
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: pnpm を用意
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を導入
        run: pnpm install --frozen-lockfile
      - name: audit
        run: pnpm audit --audit-level high
