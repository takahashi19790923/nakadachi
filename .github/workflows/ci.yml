name: CI

# ★ここではデプロイしない。★ 本番へ出すのは Cloudflare Workers Builds と
# GitHub リポジトリの連携で行い、CI に本番の Secret を持たせない。
# デプロイ用のトークンを GitHub へ置かずに済む構成を優先している。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ★既定の権限を最小にする。★ ジョブごとに必要なものだけを足す。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 外部 Action はコミット SHA で固定する。タグは動かせるため。
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入（lockfile どおり）
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint

      - name: typecheck
        run: pnpm run typecheck

      - name: 単体テスト
        run: pnpm run test

      # 統合テストは PGlite（PostgreSQL の WASM ビルド）を自分で立てる。
      # サービスコンテナも外部の DB も要らない。
      - name: 統合テスト
        run: pnpm run test:integration

      - name: build
        run: pnpm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入
        run: pnpm install --frozen-lockfile

      - name: ブラウザを用意
        run: pnpm exec playwright install --with-deps chromium

      # ★本番ビルドに対して実行する。★ 開発サーバーだと Vite が
      # HMR 用のインラインスクリプトを差し込み、CSP 違反が必ず出るため
      # 「本番でも壊れているのか」を区別できない。
      - name: E2E
        run: pnpm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    name: 依存の脆弱性確認
    runs-on: ubuntu-latest
    # pull_request でしか動かない Action。
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: dependency-review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: 既知の脆弱性
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Node を用意
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を導入
        run: pnpm install --frozen-lockfile
      - name: audit
        run: pnpm audit --audit-level high
