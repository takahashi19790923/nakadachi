name: CI

# ★ここではデプロイしない。★ 本番へ出すのは Cloudflare Workers Builds と
# GitHub リポジトリの連携で行い、CI に本番の Secret を持たせない。
# デプロイ用のトークンを GitHub へ置かずに済む構成を優先している。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ★既定の権限を最小にする。★ ジョブごとに必要なものだけを足す。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 外部 Action はコミット SHA で固定する。タグは動かせるため。
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Node を用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入（lockfile どおり）
        run: pnpm install --frozen-lockfile

      # ★lint より先に型を生成する。★ ルートの型（./+types/*）は
      # react-router typegen が作る。手元には前回のビルドの残りがあるので
      # 気づかないが、まっさらな CI では型が解決できず lint が落ちる。
      - name: 型を生成
        run: pnpm exec react-router typegen

      - name: lint
        run: pnpm run lint

      - name: typecheck
        run: pnpm run typecheck

      - name: 単体テスト
        run: pnpm run test

      # 統合テストは PGlite（PostgreSQL の WASM ビルド）を自分で立てる。
      # サービスコンテナも外部の DB も要らない。
      - name: 統合テスト
        run: pnpm run test:integration

      - name: build
        run: pnpm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # ★ここに PostgreSQL のサービスコンテナは置けない。★
    # アプリは @neondatabase/serverless を使っており、素の PostgreSQL とは
    # 話せない（実測: "Error connecting to database: Network connection lost"）。
    # そのため CI では DB を使う画面を検査できない。
    # DB を使う検査（404 を返すか等）は spec 側で /api/health を見て飛ばす。
    #
    # 本気で CI から DB を触るなら、Neon のブランチを CI ごとに作る
    # （neondatabase/create-branch-action）。Neon の API キーを CI へ
    # 置くことになるので、入れるかどうかは運用の判断。

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Node を用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を導入
        run: pnpm install --frozen-lockfile

      - name: 型を生成
        run: pnpm exec react-router typegen

      - name: ブラウザを用意
        run: pnpm exec playwright install --with-deps chromium

      # ★本番ビルドに対して実行する。★ 開発サーバーだと Vite が
      # HMR 用のインラインスクリプトを差し込み、CSP 違反が必ず出るため
      # 「本番でも壊れているのか」を区別できない。
      - name: E2E
        run: pnpm run test:e2e

      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    name: 依存の脆弱性確認
    runs-on: ubuntu-latest
    # pull_request でしか動かない Action。
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dependency-review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: 既知の脆弱性
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pnpm を用意
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Node を用意
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: 依存を導入
        run: pnpm install --frozen-lockfile
      - name: audit
        run: pnpm audit --audit-level high
