name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 依存や規則の更新で新しく見つかることがあるので、週1回は流す。
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: 解析
    # ★private リポジトリでは Code Scanning に GitHub Advanced Security が要る。★
    # 無い状態で動かすと結果の送信で必ず失敗し、毎回赤くなる。
    # 赤が常態化すると、本当の失敗を誰も見なくなる。公開にすれば自動で有効。
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 結果を GitHub のセキュリティタブへ送るために要る。
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: CodeQL を初期化
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: ${{ matrix.language }}
          # 既定に加えて、品質面の規則も回す。
          queries: security-and-quality

      - name: 解析
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
