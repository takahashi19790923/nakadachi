name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 依存や規則の更新で新しく見つかることがあるので、週1回は流す。
    - cron: "17 3 * * 1"
  # ★手動で回せるようにしておく。★ 再実行（rerun）は元のイベントを使うので、
  # リポジトリの公開設定を変えた直後などは、新しいイベントが要る。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: 解析
    # ★private リポジトリでは Code Scanning に GitHub Advanced Security が要る。★
    # 無い状態で動かすと結果の送信で必ず失敗し、毎回赤くなる。
    # 赤が常態化すると、本当の失敗を誰も見なくなる。公開にすれば自動で有効。
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # 結果を GitHub のセキュリティタブへ送るために要る。
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL を初期化
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # 既定に加えて、品質面の規則も回す。
          queries: security-and-quality

      - name: 解析
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
