# pnpm 11 は依存のインストール時スクリプトを既定で実行しない（サプライチェーン対策）。
# esbuild と workerd はネイティブバイナリを取得するため実行が要る。ここに挙げた
# ものだけが走る。新しい名前が増えたら、なぜ必要かを確かめてから足すこと。
allowBuilds:
  esbuild: true
  workerd: true

# 公開直後の版を掴まないための待機（既定）から除外したもの。
# 3つとも Cloudflare 公式で、この構成に必要な最新版。
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin@1.52.0'
  - miniflare@5.20260811.0-alpha
  - wrangler@4.122.0

# drizzle-kit が @esbuild-kit 経由で esbuild 0.18 を引き込む。
# 0.24.2 以下は開発サーバーが任意サイトからの要求に応答する脆弱性がある
# （GHSA / Dependabot が検出）。drizzle-kit はここで開発サーバーを立てないので
# 実害は薄いが、警告を放置すると本当の警告を見なくなるので上書きする。
# ★上げたあと db:generate が通ることを実際に確かめること。★
overrides:
  esbuild: '>=0.25.0'
  # 2026-10-02: 開発用の道具（miniflare・eslint）経由の既知の脆弱性。本番の Worker には載らないが、
  # CI の «既知の脆弱性»（必須）が落ちてマージできないため、影響する版の範囲だけ上げる。
  # 上流（wrangler / eslint）が直した版に追いついたら消してよい。
  'sharp@<0.35.4': '^0.35.4'
  'undici@>=7.0.0 <7.29.1': '^7.29.1'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
